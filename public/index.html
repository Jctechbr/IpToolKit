<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP ToolKit</title>

  <!-- Pre-paint theme script: reads localStorage before CSS to prevent flash.
       Nonce must match nginx.conf CSP nonce for script-src. -->
  <script nonce="itx-theme">
    (function () {
      var s = localStorage.getItem("itx-theme");
      var d = document.documentElement;
      if (s === "dark") { d.dataset.theme = "dark"; }
      else if (s === "light") { d.dataset.theme = "light"; }
      else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        d.dataset.theme = "dark";
      }
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/app.css" />

  <meta name="description" content="Self-hosted IPv4/IPv6 network calculator: subnet, prefix list, allocation, embedding, routes, planning and more." />
</head>
<body>

<header class="header" role="banner">
  <div class="header__inner">
    <!-- Logo -->
    <a href="#calc" class="logo" aria-label="IP ToolKit home">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="7" fill="var(--brand-primary)"/>
        <text x="4" y="21" font-family="monospace" font-size="17" fill="white" font-weight="bold">IP</text>
      </svg>
      <span class="logo-text">IP ToolKit</span>
    </a>

    <!-- Tab navigation -->
    <nav aria-label="Tools">
      <ul class="tab-nav" role="tablist">
        <!-- Phase 1 -->
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="calc" aria-selected="false">
            Calculator
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="embed" aria-selected="false">
            Embed 4-in-6
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="prefixlist" aria-selected="false">
            Prefix List
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="allocate" aria-selected="false">
            Allocate
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="option43" aria-selected="false">
            WLC Option 43
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="aruba_dhcp" aria-selected="false">
            Aruba DHCP
          </button>
        </li>
        <!-- Phase 2 -->
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="tree" aria-selected="false">
            Tree
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="diffs" aria-selected="false">
            Diffs
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" data-tool="routes" aria-selected="false">
            Routes
          </button>
        </li>
        <!-- Phase 3 (coming soon) -->
        <li role="presentation">
          <button class="tab-btn" role="tab" aria-disabled="true" title="Coming in Phase 3">
            Planner
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" aria-disabled="true" title="Coming in Phase 3">
            Patterns
          </button>
        </li>
        <li role="presentation">
          <button class="tab-btn" role="tab" aria-disabled="true" title="Coming in Phase 3">
            Practice
          </button>
        </li>
      </ul>
    </nav>

    <!-- Theme toggle -->
    <button class="theme-toggle" id="theme-toggle" type="button"
            role="switch" aria-label="Toggle colour theme" aria-checked="false"
            title="Toggle theme (light/dark/system)">
      <svg id="theme-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <!-- Sun icon (shown in dark mode) -->
        <g class="icon-sun">
          <circle cx="9" cy="9" r="4" stroke="currentColor" stroke-width="1.5"/>
          <line x1="9" y1="1" x2="9" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="15" x2="9" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="9" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3.22" y1="3.22" x2="4.64" y2="4.64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.36" y1="13.36" x2="14.78" y2="14.78" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3.22" y1="14.78" x2="4.64" y2="13.36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.36" y1="4.64" x2="14.78" y2="3.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </svg>
    </button>
  </div>
</header>

<main id="view" role="main">
  <!-- Tool content is injected here by app.js -->
  <div class="empty-state">Loading…</div>
</main>

<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
