server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (applied to all responses; location blocks inherit these)
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "interest-cohort=()"              always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'nonce-itx-theme'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # Cache: HTML — no-store; JS/CSS/assets — immutable 1 year
    location = /index.html {
        # nginx inherits parent add_header only when location has no add_header of its own.
        # We add Cache-Control here, so we must repeat the security headers.
        add_header Cache-Control            "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options   "nosniff"                             always;
        add_header X-Frame-Options          "SAMEORIGIN"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy       "interest-cohort=()"                  always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'nonce-itx-theme'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self';" always;
    }

    location ~* \.(js|css|svg|ico|png|woff2?)$ {
        add_header Cache-Control            "no-cache"                            always;
        add_header X-Content-Type-Options   "nosniff"                             always;
        add_header X-Frame-Options          "SAMEORIGIN"                          always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy       "interest-cohort=()"                  always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'nonce-itx-theme'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self';" always;
    }

    # SPA fallback: any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
