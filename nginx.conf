server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # style-src-attr allows the style="" attributes the tools render.
    # style-src stays 'self', so a <style> block cannot be injected.
    # No script nonce: the theme script is an external file. A hardcoded
    # nonce is public and would let injected HTML run as script.
    set $itx_csp "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'";

    # Security headers (applied to all responses; location blocks inherit these)
    add_header X-Content-Type-Options        "nosniff" always;
    add_header X-Frame-Options               "DENY" always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy            "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy       $itx_csp always;
    add_header Cross-Origin-Opener-Policy    "same-origin" always;
    add_header Cross-Origin-Resource-Policy  "same-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    # text/html is already in the default gzip_types list; repeating it warns.
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # Regex locations are first-match. The dotfile deny has to come before
    # the static-asset regex, or /.hidden.js is served as a script.
    location ~ /\. {
        deny all;
    }

    # Cache: HTML is no-store so the shell is always fetched.
    # JS/CSS stay no-cache: the browser may store them, but it revalidates
    # every visit. Do not switch these to immutable until the ?v= query
    # strings are generated from file contents. They are hand-bumped today
    # (app.js?v=6, tools ?v=2 or ?v=3), and a missed bump would pin a stale file.
    location = /index.html {
        # nginx inherits parent add_header only when location has no add_header of its own.
        # We add Cache-Control here, so we must repeat the security headers.
        add_header Cache-Control                 "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options               "DENY" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy            "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy       $itx_csp always;
        add_header Cross-Origin-Opener-Policy    "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
    }

    location ~* \.(js|css|svg|ico|png|woff2?)$ {
        add_header Cache-Control                 "no-cache" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options               "DENY" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy            "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy       $itx_csp always;
        add_header Cross-Origin-Opener-Policy    "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
    }

    # SPA fallback: any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
